name: inputs-demo

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Choose the environment to deploy"
        required: true
        default: dev
        type: choice
        options:
          - test
          - prod

jobs:
  inputs-demo:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy the app
        run: echo "Deploying the application to ${{ inputs.environment }}"
